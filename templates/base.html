<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block judul %}Sistem Manajemen Keuangan UMKM{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; font-size: 16px; max-width: 960px; margin: 24px auto; padding: 0 16px; color: #111; }
    nav { background: #e5e5e5; padding: 12px 16px; border: 1px solid #333; margin-bottom: 20px; display: flex; gap: 16px; }
    nav a { text-decoration: none; color: #111; font-weight: bold; }
    .pesan { background: #eef6ee; border: 1px dashed #2e7d32; color: #1b5e20; padding: 10px 14px; }
    .galat { background: #fef2f2; border: 1px dashed #b91c1c; color: #991b1b; padding: 10px 14px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #333; padding: 8px 10px; text-align: left; }
    th { background: #e5e5e5; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('beranda') }}">Beranda</a>
    <a href="{{ url_for('daftar_kategori') }}">Kategori</a>
    <a href="{{ url_for('daftar_transaksi') }}">Transaksi</a>
  </nav>
  {% for pesan in get_flashed_messages() %}
    <p class="pesan">{{ pesan }}</p>
  {% endfor %}
  {% block isi %}{% endblock %}
</body>
</html>
