{% extends "base.html" %}
{% block judul %}{{ judul }}{% endblock %}
{% block isi %}
<h1>{{ judul }}</h1>
{% for g_ in galat %}
  <p class="galat" role="alert">{{ g_ }}</p>
{% endfor %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Tanggal (TTTT-BB-HH)
    <input type="date" name="tanggal" value="{{ transaksi.get('tanggal', default_tanggal) }}" required>
  </label>
  <label>Jenis Transaksi
    <select name="jenis" required>
      <option value="">-- Pilih Jenis --</option>
      <option value="pemasukan" {% if transaksi.get('jenis') == 'pemasukan' %}selected{% endif %}>pemasukan</option>
      <option value="pengeluaran" {% if transaksi.get('jenis') == 'pengeluaran' %}selected{% endif %}>pengeluaran</option>
    </select>
  </label>
  <label>Kategori
    <select name="kategori_id" required>
      <option value="">-- Pilih Kategori --</option>
      {% for k in kategori %}
      <option value="{{ k['id'] }}" {% if transaksi.get('kategori_id')|string == k['id']|string %}selected{% endif %}>
        {{ k['nama_kategori'] }}
      </option>
      {% endfor %}
    </select>
  </label>
  <label>Keterangan (maks. 50 karakter)
    <input type="text" name="keterangan" value="{{ transaksi.get('keterangan', '') }}" required maxlength="50">
  </label>
  <label>Nominal (Rp, angka bulat &gt; 0)
    <input type="number" name="nominal" value="{{ transaksi.get('nominal', '') }}" required min="1" step="1">
  </label>
  <p>
    <button type="submit">Simpan</button>
    <a href="{{ url_for('daftar_transaksi') }}">Batal</a>
  </p>
</form>
{% endblock %}
